{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Squad Selector</h1>
    <p class="page-subtitle">Select a match format, your team, and the opposition to generate the optimal 11-man squad.</p>
</div>

<div class="form-card card">
    <form id="squad-form">
        <div class="form-grid">
            <div class="form-group">
                <label for="format" class="form-label">Match Format</label>
                <select id="format" name="format" class="form-select" required>
                    <option value="" disabled selected>Select format</option>
                    <option value="T20">T20</option>
                    <option value="ODI">ODI</option>
                    <option value="Test">Test</option>
                </select>
            </div>

            <div class="form-group">
                <label for="team" class="form-label">Your Team</label>
                <select id="team" name="team" class="form-select" required disabled>
                    <option value="" disabled selected>Select format first</option>
                </select>
            </div>

            <div class="form-group">
                <label for="opposition" class="form-label">Opposition</label>
                <select id="opposition" name="opposition" class="form-select" required disabled>
                    <option value="" disabled selected>Select your team first</option>
                </select>
            </div>
        </div>

        <div class="same-team-warning hidden" id="same-team-warning">
            A team cannot play against itself. Please select a different opposition.
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary" id="generate-btn" disabled>
                Generate Squad
            </button>
        </div>
    </form>
</div>

<!-- Spinner shown while loading -->
<div id="loading-spinner" class="spinner-wrap hidden">
    <div class="spinner"></div>
    <p class="spinner-text">Generating squad…</p>
</div>

<!-- Results area (populated by JS) -->
<div id="results-section" class="hidden">
    <div class="results-header">
        <h2 class="results-title" id="results-title"></h2>
        <p class="results-meta" id="results-meta"></p>
    </div>
    <div id="results-container"></div>
    <div id="save-squad-wrap" class="save-squad-wrap"></div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
