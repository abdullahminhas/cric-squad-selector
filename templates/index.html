<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cric Squad Selector</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 40px 50px;
        max-width: 600px;
        text-align: center;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin-bottom: 16px;
        font-size: 2.2rem;
      }
      p {
        margin: 0;
        font-size: 1.05rem;
        color: #cbd5e1;
        line-height: 1.6;
      }
      .tag {
        display: inline-block;
        margin-top: 20px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #facc15;
        color: #111827;
        font-weight: bold;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Cric Squad Selector</h1>
      <p>
        A smart cricket team selector built around player data, match
        performance, and squad strategy.
      </p>
    </div>
  </body>
</html>
