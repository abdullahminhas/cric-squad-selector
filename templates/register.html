{% extends "base.html" %}
{% block content %}

<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="auth-icon">🏏</div>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join to save and track your squad selections</p>
        </div>

        <div id="auth-error" class="auth-alert hidden"></div>
        <div id="auth-success" class="auth-alert auth-alert-success hidden"></div>

        <form id="register-form" class="auth-form" novalidate>
            <div class="form-group">
                <label for="reg-username" class="form-label">Username</label>
                <input
                    type="text"
                    id="reg-username"
                    class="form-input"
                    placeholder="Choose a username"
                    autocomplete="username"
                    required
                >
            </div>
            <div class="form-group">
                <label for="reg-email" class="form-label">Email</label>
                <input
                    type="email"
                    id="reg-email"
                    class="form-input"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>
            <div class="form-group">
                <label for="reg-password" class="form-label">Password</label>
                <input
                    type="password"
                    id="reg-password"
                    class="form-input"
                    placeholder="Create a strong password"
                    autocomplete="new-password"
                    required
                >
            </div>
            <button type="submit" class="auth-btn btn-primary" id="register-btn">
                <span id="register-btn-text">Create Account</span>
                <span id="register-btn-spinner" class="btn-spinner hidden"></span>
            </button>
        </form>

        <p class="auth-footer">
            Already have an account? <a href="/login" class="auth-link">Sign in</a>
        </p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
