{% extends "base.html" %}
{% block content %}

<div class="auth-page">
    <div class="auth-card card">
        <div class="auth-header">
            <div class="auth-icon">🏏</div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your saved squads</p>
        </div>

        <div id="auth-error" class="auth-alert hidden"></div>
        <div id="auth-success" class="auth-alert auth-alert-success hidden"></div>

        <form id="login-form" class="auth-form" novalidate>
            <div class="form-group">
                <label for="login-username" class="form-label">Username</label>
                <input
                    type="text"
                    id="login-username"
                    class="form-input"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>
            <div class="form-group">
                <label for="login-password" class="form-label">Password</label>
                <input
                    type="password"
                    id="login-password"
                    class="form-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>
            <button type="submit" class="auth-btn btn-primary" id="login-btn">
                <span id="login-btn-text">Sign In</span>
                <span id="login-btn-spinner" class="btn-spinner hidden"></span>
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account? <a href="/register" class="auth-link">Create one</a>
        </p>
    </div>
</div>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
