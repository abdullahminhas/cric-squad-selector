<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cric Squad Selector</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container" id="nav-container">
            <a href="/" class="nav-logo">Cric Squad Selector</a>
            <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>

            <!-- Global Player Search -->
            <div class="nav-search-wrap" id="nav-search-wrap">
                <input
                    type="text"
                    id="nav-player-search"
                    class="nav-search-input"
                    placeholder="Search player…"
                    autocomplete="off"
                    aria-label="Search player"
                >
                <ul class="nav-search-dropdown hidden" id="nav-search-dropdown"></ul>
            </div>

            <div class="nav-links">
                <a href="/" class="nav-link {% if request.path == '/' %}nav-link-active{% endif %}">Squad Selector</a>
                <a href="/player-dashboard" class="nav-link {% if request.path == '/player-dashboard' %}nav-link-active{% endif %}">Player Dashboard</a>
                {% if current_user.is_authenticated %}
                    <a href="/saved-squads" class="nav-link {% if request.path == '/saved-squads' %}nav-link-active{% endif %}">Saved Squads</a>
                    <a href="/logout" class="nav-link nav-link-logout">Logout</a>
                    <span class="nav-username">{{ current_user.username }}</span>

                {% else %}
                    <a href="/login" class="nav-link {% if request.path == '/login' %}nav-link-active{% endif %}">Login</a>
                    <a href="/register" class="nav-btn">Register</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Global search JS (runs on every page) -->
    <script src="{{ url_for('static', filename='js/search.js') }}"></script>
    <script>
        (function() {
            var btn = document.getElementById('nav-hamburger');
            var links = document.querySelector('.nav-links');
            if (btn && links) {
                btn.addEventListener('click', function() {
                    var isOpen = links.classList.toggle('nav-open');
                    btn.classList.toggle('open', isOpen);
                    btn.setAttribute('aria-expanded', isOpen);
                });
            }
        })();
    </script>
</body>
</html>
